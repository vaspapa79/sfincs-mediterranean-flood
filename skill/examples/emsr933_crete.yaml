# EMSR933 Crete, 30 Sep – 5 Oct 2026 — BASELINE (ERA5 rain-on-grid, no enhanced forcing).
#
# Third held-out event of the frozen rule R and the first PROSPECTIVE one: rule frozen 2026-07-15,
# EMS activation 2026-10-04 11:02 UTC, configuration written 2026-10-09 by the Stage-1 rule ledger
# (reproduction/emsr933/rule_ledger.md) before any model run and without reference to the EMS
# extents. The baseline mirrors the development-event baselines (ERA5 hourly rain, no coastal/wind/
# infiltration/upstream blocks). Values marked GAP-n are not fixed by R (see ledger) and await the
# author decision; `notes:` lists the declared deviations forced by data latency.

event:
  id: EMSR933
  name: Crete
  slug: crete
  date: 2026-10-01          # EMS eventTime 2026-10-01T07:00 UTC (API snapshot 2026-10-09T12:47:20Z)
  location: "Crete, Greece — Lefka Ori / Psiloritis / Dikti massifs and the N, NE and SE coasts"
  reason: "Quasi-stationary cut-off low over the E Mediterranean, persistent N–NE flow, five-day orographic rainfall (NOA)"

# CODE-13 (2026-10-19): harness v1.4 approved for EMSR933 (D1 IMERG rates, D2 IB boundary, D4 coastal set-up).
harness_version: v1.4

window:
  spinup_days: 7            # multi-day event convention (Table 2: Pineios, Strymonas 7 d)
  pre_event_days: 3         # Table 2 convention 2–3 d  -> tstart 2026-09-28 00:00
  post_event_days: 4        # Table 2 convention 2–4 d  -> tstop  2026-10-06 00:00 (rain ended 5 Oct morning)

bbox:                       # island-wide domain (ledger §5; per-cluster alternative recorded there)
  west: 23.40
  south: 34.80
  east: 26.40
  north: 35.70
  era5_buffer_deg: 0.3

crs:
  epsg: 32634               # UTM 34N for the whole island; scale factor k <= 1.00216 at 26.0 E (ledger §5)

grid:
  res: 100                  # GAP-1: R does not fix dx; Table 2 / S4 conventions give the Valencia analogue (100 m). Alternatives in ledger §5.
  rotated: false
  subgrid_pixels: 4
  manning_land: 0.04
  manning_sea: 0.02
  zmin: -2
  zmax: 2500                # GAP-2: the 250/400 m convention would exclude the plateaus and massifs that produce the runoff (AOI terrain to 2329 m)
  fill_area_km2: 20
  drop_area_km2: 5

paths:
  work_dir: C:/Users/vaspapa/Desktop/ELKAK/implementation/emsr933_crete
  deliverable_dir: C:/Users/vaspapa/Desktop/ELKAK/deliverable_crete_emsr933
  zip_dir: C:/Users/vaspapa/Desktop/ELKAK

env:
  python: C:/Users/vaspapa/AppData/Local/miniforge3/envs/sfincs-viz/python.exe
  hydromt: C:/Users/vaspapa/AppData/Local/miniforge3/envs/sfincs-viz/Scripts/hydromt.exe
  sfincs_exe: C:/Users/vaspapa/Desktop/ELKAK/implementation/SFINCS_bin/SFINCS_v2.3.0_mt_Faber_release_exe/sfincs.exe
  gdal_data: C:/Users/vaspapa/AppData/Local/miniforge3/envs/sfincs-viz/Library/share/gdal
  gdalbuildvrt: C:/Users/vaspapa/AppData/Local/miniforge3/envs/sfincs-viz/Library/bin/gdalbuildvrt.exe
  cds_key_file: ~/.cdsapirc

ems:
  base_url: https://rapidmapping.emergency.copernicus.eu/backend
  activation: EMSR933
  aois:                     # documentation only (API auto-discovery); 8 AOIs on 2026-10-09
    - AOI01_Kastelli
    - AOI02_Irakleio
    - AOI03_Tzermiado
    - AOI04_Agios_Ioannis
    - AOI05_Anogeia
    - AOI06_Agios_Nikolaos
    - AOI07_Omalos
    - AOI08_Monastiraki
  iterations: [DEL, DEL_MONIT01, DEL_MONIT02, DEL_MONIT03]
  include_del_product: true          # AOI03 first delineation is a DEL_PRODUCT package (F2 switch)
  exclude_not_analysed: true         # Stage-4 switch (F6-i): notAnalysedA polygons leave the evaluation mask
  truth_cutoff_snapshot_utc: "2026-10-09T12:47:20Z"   # provisional truth = packages released at this API snapshot

notes:
  - "Provisional truth: validation uses only the packages of the 2026-10-09T12:47:20Z API snapshot (reproduction/emsr933/); pipeline step 01 must be skipped at Stage 2/4 and data/ems_polygons populated from the snapshot."
  - "ERA5 for 27 Sep–5 Oct 2026 is ERA5T (expver 0005) at the time of writing; prep_inputs.py records the expver per step."
  - "GAP-1 dx and GAP-2 z_max are not fixed by rule R; values here follow the Table 2 / S4 conventions and are flagged for the author decision (ledger §5)."

animation:
  canvas_width: 940
  basemap_zoom: 11
  basemap_buffer_m: 3000
  mp4: {fps: 12, dpi: 110, bitrate_kbps: 4000}
  cities:
    - {name: Heraklion, lat: 35.3387, lon: 25.1442}
    - {name: Chania, lat: 35.5138, lon: 24.0180}
    - {name: Rethymno, lat: 35.3647, lon: 24.4820}
    - {name: Agios Nikolaos, lat: 35.1911, lon: 25.7147}
    - {name: Ierapetra, lat: 35.0105, lon: 25.7389}
    - {name: Tzermiado, lat: 35.1842, lon: 25.4852}
    - {name: Kastelli, lat: 35.2099, lon: 25.3361}
    - {name: Anogeia, lat: 35.2905, lon: 24.8812}
    - {name: Omalos, lat: 35.3351, lon: 23.8972}
